server:
  port: ${PORT:8080}

spring:
  application:
    name: adaptiveos
  jackson:
    serialization:
      write-dates-as-timestamps: false

adaptiveos:
  cors:
    # comma-separated list; override with ADAPTIVEOS_CORS_ALLOWED_ORIGINS
    allowed-origins: ${ADAPTIVEOS_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
