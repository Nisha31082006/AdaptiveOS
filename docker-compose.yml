services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      # Comma-separated list of origins allowed to call the API.
      ADAPTIVEOS_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173,http://localhost:8081"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "http://localhost:8080/api"
    ports:
      - "8081:80"
    depends_on:
      - backend
